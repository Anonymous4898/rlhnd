<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bimanual retargeting sample</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#14202b;--mut:#5b6b78;--line:#e3e8ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:40px 16px 80px}
h1{font-weight:700;letter-spacing:-.02em;font-size:30px;margin:0 0 6px}
p.sub{color:var(--mut);margin:0 0 30px}
h2{font-weight:600;font-size:19px;margin:34px 0 10px}
figure{margin:0 0 8px}
video{width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}
figcaption{color:var(--mut);font-size:14px;margin-top:8px}
.key{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:14px;margin:0 0 26px}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
</style></head><body><div class="wrap">
<h1>Bimanual retargeting &mdash; sample</h1>
<p class="sub">Input clip and the retargeted robot hands side by side, same clip, same 81 frames.
ARCTIC ego <code>s05/box_grab_01</code>: a two-handed box lift, so both hands are tracked throughout.</p>
<div class="key">
  <span><i style="background:#4fd9c0"></i>right hand</span>
  <span><i style="background:#f28c40"></i>left hand</span>
  <span>wrist trajectory drawn as it accumulates</span>
</div>

<h2>Inspire RH56</h2>
<figure><video src="videos/sample_bimanual_inspire.mp4" autoplay loop muted playsinline controls></video>
<figcaption>Both hands retargeted with DexPilot from the RLHND prediction.</figcaption></figure>

<h2>Shadow</h2>
<figure><video src="videos/sample_bimanual_shadow.mp4" autoplay loop muted playsinline controls></video>
<figcaption>Same clip, Shadow hand. The long forearms overlap at this camera angle.</figcaption></figure>

</div></body></html>
